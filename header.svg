<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Rashed, independent product engineer">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e4c27a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#e4c27a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e4c27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ea38a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8ea38a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8ea38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d7b06a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f3efe6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d7b06a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="460" fill="#0c0d0b"/>
  <g filter="url(#blur)">
    <circle cx="980" cy="70" r="150" fill="url(#glowA)">
      <animate attributeName="cx" values="940;1040;940" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;120;40" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="400" r="130" fill="url(#glowB)">
      <animate attributeName="cx" values="120;240;120" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;340;420" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="1010" cy="230" r="108" fill="none" stroke="#d7b06a" stroke-opacity="0.7" stroke-width="1.25" stroke-dasharray="3 11">
      <animateTransform attributeName="transform" type="rotate" from="0 1010 230" to="360 1010 230" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="230" r="72" fill="none" stroke="#f4f1ea" stroke-opacity="0.4" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="360 1010 230" to="0 1010 230" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="122" r="4" fill="#d7b06a">
      <animateTransform attributeName="transform" type="rotate" from="0 1010 230" to="360 1010 230" dur="36s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="64" y="78" width="3" height="168" fill="#d7b06a">
    <animate attributeName="height" from="0" to="168" dur="1.1s" fill="freeze"/>
  </rect>
  <text x="84" y="96" fill="#d7b06a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4">PORTFOLIO</text>
  <text x="84" y="188" fill="#f6f1e7" font-family="Georgia, Palatino, Palatino Linotype, serif" font-size="84">Rashed</text>
  <text x="86" y="242" fill="#c9c2b4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" opacity="1">I design, build, and run live products.
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.28;0.33;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="86" y="242" fill="#c9c2b4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" opacity="0">Web, Android, and market tools.
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.61;0.66;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="86" y="242" fill="#c9c2b4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" opacity="0">Private code. Public products.
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.94;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="86" y="330" fill="#f6f1e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3">WEB</text>
  <text x="168" y="330" fill="#8d877c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">·</text>
  <text x="196" y="330" fill="#f6f1e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3">ANDROID</text>
  <text x="330" y="330" fill="#8d877c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">·</text>
  <text x="358" y="330" fill="#f6f1e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3">MARKETS</text>
  <rect x="86" y="348" width="120" height="2" fill="url(#sweep)">
    <animate attributeName="x" values="86;430;86" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <text x="86" y="400" fill="#8d877c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Independent product engineer</text>
</svg>
